[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "majorana-lattice"
version = "0.1.0"
description = "Matching codes, anyons and Majorana modes on trivalent lattices, simulated with Stim"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Moth Quantum" }]
requires-python = ">=3.10"
dependencies = ["stim>=1.13"]
keywords = ["quantum", "stabilizer codes", "anyons", "Majorana", "stim", "quantum games"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/moth-quantum/majorana-lattice"

[tool.hatch.build.targets.wheel]
packages = ["src/majorana_lattice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
